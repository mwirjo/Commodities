<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Backup Photos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 30px;
            color: #555;
        }

        .photo-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .photo-container img {
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .back-btn {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Backup Visuals</h1>
    <p>The dashboard data could not load. Here are the backup images.</p>

    <div class="photo-container" id="photoContainer"></div>

    <button class="back-btn" onclick="goBack()">Go Back to Dashboard</button>

    <script>
        const imageUrls = [
            "/images/photo1.jpg",
            "/images/photo2.jpg",
            "/images/photo3.jpg",
            "/images/photo4.jpg",
            "/images/photo5.jpg",
            "/images/photo6.jpg",
            "/images/photo7.jpg",
            "/images/photo8.jpg",
            "/images/photo9.jpg"
        ];

        const container = document.getElementById("photoContainer");

        imageUrls.forEach(url => {
            const img = document.createElement("img");
            img.src = url;
            img.alt = "Backup Image";
            container.appendChild(img);
        });

        function goBack() {
            window.history.back();
        }
    </script>

</body>

</html>
